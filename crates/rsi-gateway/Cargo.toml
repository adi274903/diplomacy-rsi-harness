[package]
name = "rsi-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Low-latency OpenAI-compatible gateway in front of vLLM/SGLang: priority admission, response cache, prefix-affinity routing, token budget, metrics, load generator"

[[bin]]
name = "rsi-gateway"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
blake3 = "1.8"
bytes = "1"
clap = { version = "4.6", features = ["derive", "env"] }
futures-util = "0.3"
hdrhistogram = "7.5"
reqwest = { version = "0.13", features = ["stream"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
