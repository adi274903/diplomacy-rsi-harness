[package]
name = "rsi-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CPU-bound hot paths for the RSI harness: metrics + bootstrap, n-gram contamination index, prompt leak guard"

[lib]
name = "rsi_core"
crate-type = ["cdylib", "rlib"]

[features]
# `python` is enabled by maturin (see pyproject.toml). `cargo test --no-default-features` runs the pure-Rust tests.
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py310"], optional = true }
aho-corasick = "1.1"
rayon = "1.12"
